{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Регистрация в Street Shop</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100">
                        Зарегистрироваться
                    </button>
                </form>

                <div class="mt-3 text-center">
                    Уже есть аккаунт? <a href="{% url 'registration:login' %}">Войдите</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
